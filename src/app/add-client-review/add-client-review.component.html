<section class=" pt-24">
    <div class="py-8 px-4 mx-auto max-w-2xl lg:py-16">

        <!-- Success & Error Messages at the Top -->
        <div *ngIf="successMessage" class="bg-green-500 text-white p-3 rounded-lg mb-4 text-center">
            {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="bg-red-500 text-white p-3 rounded-lg mb-4 text-center">
            {{ errorMessage }}
        </div>

        <h2 class="mb-4 text-xl font-bold">Add a Review</h2>
        <form (ngSubmit)="onSubmit()">
            <div class="grid gap-4 sm:grid-cols-2 sm:gap-6">

                <!-- Name Field -->
                <div class="sm:col-span-2">
                    <label for="name" class="block mb-2 text-sm font-medium">
                        Name
                    </label>
                    <input type="text" name="name" id="name" [(ngModel)]="review.name" required
                        [ngClass]="{'border-red-500': isNameInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="Type name">
                    <p *ngIf="isNameInvalid" class="text-red-500 text-sm mt-1"> Name is required.</p>
                </div>

                <!-- Review Field -->
                <div class="sm:col-span-2">
                    <label for="review" class="block mb-2 text-sm font-medium">
                        Review
                    </label>
                    <textarea id="review" name="review" rows="4" [(ngModel)]="review.review" required
                        [ngClass]="{'border-red-500': isReviewInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="Write your review here"></textarea>
                    <p *ngIf="isReviewInvalid" class="text-red-500 text-sm mt-1">Review is required.</p>
                </div>
            </div>

            <button type="submit"
                class="inline-flex items-center px-5 py-2.5 mt-4 sm:mt-6 text-sm font-medium text-white bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-200 dark:focus:ring-blue-900 hover:bg-blue-800">
                Submit Review
            </button>
        </form>
    </div>
</section>
