<section class="pt-4">
    <div class="py-8 px-4 mx-auto max-w-2xl lg:py-16">

        <!-- Success & Error Messages -->
        <div *ngIf="successMessage" class="bg-green-500 text-white p-3 rounded-lg mb-4 text-center">
            {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="bg-red-500 text-white p-3 rounded-lg mb-4 text-center">
            {{ errorMessage }}
        </div>

        <h2 class="mb-4 text-xl font-bold ">Add a New Project</h2>
        <form (ngSubmit)="onSubmit()">
            <div class="grid gap-4 sm:grid-cols-2 sm:gap-6">

                <!-- Title Field -->
                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">Title</label>
                    <input type="text" [(ngModel)]="project.title" name="title"
                        [ngClass]="{'border-red-500': isTitleInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="Project title">
                    <p *ngIf="isTitleInvalid" class="text-red-500 text-sm mt-1">⚠️ Title is required.</p>
                </div>

                <!-- Description Field -->
                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">Description</label>
                    <textarea [(ngModel)]="project.description" name="description"
                        [ngClass]="{'border-red-500': isDescriptionInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="Write project description"></textarea>
                    <p *ngIf="isDescriptionInvalid" class="text-red-500 text-sm mt-1">⚠️ Description is required.</p>
                </div>

                <!-- Image Upload -->
                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">Image Link</label>
                    <input type="text" [(ngModel)]="project.imageUrl" name="webLink"
                        [ngClass]="{'border-red-500': isWebLinkInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="Website URL">
                    <p *ngIf="isWebLinkInvalid" class="text-red-500 text-sm mt-1">⚠️ Image link is required.</p>
                </div>


                <!-- Web Link -->
                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">Web Link</label>
                    <input type="text" [(ngModel)]="project.webLink" name="webLink"
                        [ngClass]="{'border-red-500': isWebLinkInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="Website URL">
                </div>

                <!-- GitHub Link -->
                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">GitHub Link</label>
                    <input type="text" [(ngModel)]="project.githubLink" name="githubLink"
                        [ngClass]="{'border-red-500': isGithubLinkInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent "
                        placeholder="GitHub repository link">
                </div>

                <!-- Type Selection -->
                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">Project Type</label>
                    <select [(ngModel)]="project.type" name="type" [ngClass]="{'border-red-500': isTypeInvalid}"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg ">
                        <option class="primary-bg_color" value="" disabled selected>Select type</option>
                        <option class="primary-bg_color" value="web">Web</option>
                        <option class="primary-bg_color" value="graphic">Graphic</option>
                    </select>
                    <p *ngIf="isTypeInvalid" class="text-red-500 text-sm mt-1">⚠️ Type is required.</p>
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-2 text-sm font-medium ">SecretKey</label>
                    <input type="text" [(ngModel)]="inputKey" name="secretKey"
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent ">
                </div>
            </div>

            <button type="submit"
                class="px-5 py-2.5 mt-4 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800">
                Submit Project
            </button>
        </form>
    </div>
</section>
