<div class="fixed inset-0  backdrop-blur-sm flex items-center justify-center z-50">

    <div
        class="bg-white/80 dark:bg-gray-500/80 p-6 rounded-2xl max-w-lg w-full mx-10 relative shadow-lg text-center backdrop-blur-md">


        <button class="absolute top-3 right-4 text-gray-600 dark:text-gray-300 text-2xl font-bold hover:text-gray-400"
            (click)="closeModal()">
            &times;
        </button>


        <img [src]="projectDetails.imageUrl" alt="Project Image" class="w-full h-52 object-contain rounded-xl mb-4">


        <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2">{{ projectDetails.title }}</h2>


        <p class="text-gray-600 dark:text-gray-300 mb-5 text-sm">
            {{ projectDetails.description }}
        </p>

        <div class="flex flex-wrap gap-2 text-white mb-3" *ngIf="(projectDetails?.techStack ?? []).length > 0">

            Tech Stack :
            <span *ngFor="let tech of projectDetails.techStack" class="inline-block px-3 py-1 mb-2 rounded-full text-xs font-semibold
        bg-blue-600/20 primary-badge-text_color border-blue-600/30">
                {{ tech }}
            </span>
        </div>
        <div class="flex justify-center gap-4">
            <app-button *ngIf="projectDetails.webLink" [secondaryBtn]="true"
                (click)="openPreviewLink(projectDetails.webLink)">View Project</app-button>
            <app-button *ngIf="projectDetails.githubLink" [secondaryBtn]="true"
                (click)="openGithubLink(projectDetails.githubLink)"><fa-icon [icon]="faGithub"
                    class="w-10 h-10"></fa-icon> View Code</app-button>
        </div>
    </div>
</div>
