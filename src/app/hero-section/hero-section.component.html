<section id="home" class="pt-24 pb-32 min-h-screen flex items-center">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

        <!-- Image (Top on mobile, Left on desktop) -->
        <div class="flex justify-center md:justify-start order-1 md:order-1">
            <div class="relative md:ml-44 lg:ml-64 w-64 h-64 sm:w-72 sm:h-72 lg:w-96 lg:h-96">

                <div
                    class="w-full h-full rounded-full bg-gradient-to-br from-blue-500/30 to-cyan-500/30 p-1 shadow-[0_0_50px_rgba(59,130,246,0.5)]">
                    <img [src]="imageSrc" alt="Kashif Imran Profile"
                        class="w-full h-full object-cover rounded-full border-4 border-gray-900" />
                </div>

                <!-- Breathing Ring -->
                <div class="absolute inset-0 rounded-full ring-4 ring-blue-500/50 breathe-ring pointer-events-none">
                </div>

            </div>
        </div>

        <!-- Right Side (Text + CTA) -->
        <div class="order-2 md:order-2 px-4 lg:px-2 text-center md:text-left">
            <p class="text-xl font-light mb-4 text-blue-400">Hello, I'm</p>

            <h1 class="text-5xl lg:text-7xl font-extrabold leading-tight mb-4">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">
                    Kashif Imran
                </span>
            </h1>

            <h2 class="text-3xl lg:text-4xl font-semibold mb-6">
                <span id="typewriter"></span>
            </h2>

            <p class="text-lg mb-8 secondary_color">
                I create <strong>dynamic, user-friendly web experiences</strong> and
                <strong>stunning visuals</strong>, blending technical excellence with artistic intuition.
                Let's build something extraordinary.
            </p>
            <div class="md:hidden flex items-center justify-evenly w-full flex-wrap my-5">

                <a *ngFor="let link of socialLinks" [href]="link.url" class="p-2 rounded-full transition duration-300">

                    <fa-icon [icon]="link.Icon" class="text-2xl w-8 h-8"></fa-icon>

                </a>

            </div>
            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row sm:justify-start space-y-4 sm:space-y-0 sm:space-x-4">
                <a href="#projects"
                    class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/50 hover:bg-blue-700 transition duration-300 transform hover:scale-[1.05] ease-out flex items-center justify-center">
                    <i class="bi bi-briefcase-fill mr-2"></i> View My Work
                </a>

                <a href="#contact"
                    class="px-8 py-3 border border-blue-600 text-blue-400 font-semibold rounded-xl hover:bg-blue-600/20 transition duration-300 transform hover:scale-[1.05] ease-out flex items-center justify-center">
                    <i class="bi bi-envelope-fill mr-2"></i> Contact Me
                </a>
            </div>
        </div>

    </div>
</section>
